[test]
pathIgnorePatterns = ["**/fixtures/**", "**/fixture/**"]
coverage = true
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["**/__tests__/**"]
concurrentTestGlob = "**/*.test.ts"
onlyFailures = true
preload = ["@adamhl8/configs/test/preload"]

[install]
linker = "isolated"

[run]
bun = true
